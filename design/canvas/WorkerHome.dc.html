<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby tasks for helpers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#F4B321}a:hover{color:#FFD060}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #13211C; color: #F4F6F2; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
      <div style="display: flex; padding: 4px; border-radius: 999px; background: #1D2E28">
        <a href="Main.dc.html" style="display: flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 999px; color: #F4F6F2; font-size: 14px; font-weight: 600; text-decoration: none">Hire</a>
        <span style="display: flex; align-items: center; min-height: 36px; padding: 0 16px; border-radius: 999px; background: #F4B321; color: #13211C; font-size: 14px; font-weight: 600">Earn</span>
      </div>
      <button type="button" role="switch" aria-checked="{{online}}" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px 0 14px; border: 1px solid #2E423B; border-radius: 999px; background: #1D2E28; color: #F4F6F2; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">
        <span>{{statusLabel}}</span>
        <span aria-hidden="true" style="display: flex; align-items: center; justify-content: {{knobSide}}; box-sizing: border-box; width: 52px; height: 32px; padding: 3px; border-radius: 999px; background: {{trackBg}}">
          <span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF"></span>
        </span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; line-height: 34px; font-weight: 700; letter-spacing: -0.5px">Tasks near you</h1>
      <span style="font-size: 14px; color: #B4C2BB">Mansarovar · within 3 km of you</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 16px; background: #1D2E28">
        <span style="font-size: 13px; color: #B4C2BB">Done today</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">2 tasks</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 16px; background: #1D2E28">
        <span style="font-size: 13px; color: #B4C2BB">Earned today</span>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700; color: #F4B321">₹300</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
        <a href="WorkerTask.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: #F4F6F2; color: #13211C; text-decoration: none">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
            <span style="font-size: 16px; line-height: 22px; font-weight: 600">{{t.title}}</span>
            <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">{{t.budget}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
            <span style="font-size: 13px; color: #55635D">{{t.meta}}</span>
            <span style="padding: 5px 10px; border-radius: 999px; background: {{t.tagBg}}; color: {{t.tagFg}}; font-size: 12px; font-weight: 600">{{t.tag}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Helper" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 12px 20px; background: #1D2E28; border-top: 1px solid #2E423B">
    <a href="WorkerHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: #F4B321; font-size: 12px; font-weight: 600; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span>Nearby</span>
    </a>
    <a href="WorkerTask.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: #B4C2BB; font-size: 12px; font-weight: 500; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>My jobs</span>
    </a>
    <a href="WorkerEarnings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: #B4C2BB; font-size: 12px; font-weight: 500; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14h.01"/></svg>
      <span>Earnings</span>
    </a>
    <a href="Welcome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; color: #B4C2BB; font-size: 12px; font-weight: 500; text-decoration: none">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>Profile</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { online: true };
  }
  renderVals() {
    var self = this;
    var online = this.state.online;
    var tasks = [
      { title: 'Carry two suitcases from the metro station', budget: '₹150', meta: '1.2 km · needed now', tag: 'Send a quote', tagBg: '#FFF3D1', tagFg: '#4A4222' },
      { title: 'Wait at a flat for a furniture delivery', budget: '₹149', meta: '0.8 km · today 4:00 pm, 1 hour', tag: 'Fixed price', tagBg: '#E3F0EA', tagFg: '#0E5A47' },
      { title: 'Arrange stock at a grocery shop', budget: '₹299', meta: '2.4 km · tomorrow 9:00 am', tag: 'Send a quote', tagBg: '#FFF3D1', tagFg: '#4A4222' }
    ];
    return {
      online: online,
      statusLabel: online ? 'Online' : 'Offline',
      knobSide: online ? 'flex-end' : 'flex-start',
      trackBg: online ? '#2F9E7E' : '#55635D',
      toggle: function () { self.setState({ online: !self.state.online }); },
      tasks: tasks
    };
  }
}
</script>
</body>
</html>
