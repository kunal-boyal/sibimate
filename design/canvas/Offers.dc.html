<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helper offers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#0E5A47}a:hover{color:#0A4335}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 24px; background: #F4F6F2; color: #13211C; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="CreateTask.dc.html" aria-label="Back to task details" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -12px; color: #13211C">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">3 helpers responded</h1>
      <span style="font-size: 13px; color: #55635D">Carry two suitcases · your budget ₹150</span>
    </div>
  </div>

  <div style="display: flex; gap: 8px">
    <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #13211C; color: #FFFFFF; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer">Fastest</button>
    <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1px solid #C9D3CB; border-radius: 999px; background: #FFFFFF; color: #13211C; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer">Lowest price</button>
    <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border: 1px solid #C9D3CB; border-radius: 999px; background: #FFFFFF; color: #13211C; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer">Top rated</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #DFE5DF">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: #E3F0EA; color: #0E5A47; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 700">{{o.initials}}</span>
          <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 16px; font-weight: 600">{{o.name}}</span>
              <svg role="img" aria-label="Verified" width="16" height="16" viewBox="0 0 24 24" fill="#0E5A47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v7c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V5z" stroke="none"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
            </div>
            <span style="font-size: 13px; color: #55635D">{{o.rating}} rating · {{o.done}} tasks done</span>
          </div>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700">{{o.price}}</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="font-size: 14px; color: #13211C">{{o.distance}} away · arrives in {{o.eta}}</span>
          <a href="Tracking.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 12px; background: {{o.btnBg}}; color: {{o.btnFg}}; border: 1.5px solid #0E5A47; font-size: 15px; font-weight: 600; text-decoration: none">Choose</a>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 12px 14px; border-radius: 14px; background: #FFF3D1; font-size: 13px; line-height: 18px; color: #4A4222">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>Still open to nearby helpers for 4 more minutes. You pay only after the task is done.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var offers = [
      { initials: 'AS', name: 'Aman S.', rating: '4.9', done: '86', price: '₹150', distance: '1.2 km', eta: '6 min', btnBg: '#0E5A47', btnFg: '#FFFFFF' },
      { initials: 'RK', name: 'Ramesh K.', rating: '4.7', done: '41', price: '₹130', distance: '2.0 km', eta: '11 min', btnBg: '#FFFFFF', btnFg: '#0E5A47' },
      { initials: 'DM', name: 'Deepak M.', rating: '4.8', done: '63', price: '₹160', distance: '1.6 km', eta: '9 min', btnBg: '#FFFFFF', btnFg: '#0E5A47' }
    ];
    return { offers: offers };
  }
}
</script>
</body>
</html>
